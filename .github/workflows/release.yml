name: Release

run-name: "Release: ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: loka.exe
            archive: loka-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: loka
            archive: loka-linux-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: loka
            archive: loka-macos-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: loka
            archive: loka-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p loka-cli

      - name: Build Loka Studio (Windows)
        if: contains(matrix.target, 'windows')
        run: |
          cd loka-studio/electron
          npm install
          npm run dist

      - name: Package (Windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive }} ${{ matrix.artifact }}
          # Also package the Studio portable exe
          cp ../../../loka-studio/electron/dist/*.exe ../../../loka-studio-windows-x64.exe

      - name: Build Windows installer (Inno Setup)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "0.0.0-dev" }
          $binary  = "target\${{ matrix.target }}\release\loka.exe"
          $studio  = Get-ChildItem "loka-studio\electron\dist\*.exe" | Select-Object -First 1 -ExpandProperty FullName
          $iscc    = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer\loka.iss" "/DLokaVersion=$version" "/DLokaBinary=$binary" "/DLokaStudio=$studio"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Copy-Item "dist\installer\loka-setup-x64.exe" "loka-setup-x64.exe" -Force

      - name: Package (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload Windows installer
        if: contains(matrix.target, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: loka-setup-x64.exe
          path: loka-setup-x64.exe

  # NOTE: the Flutter `build-studio` job was removed 2026-05-30 when the Flutter
  # Studio was deleted (Loka Studio is now the JS app in web-studio/, shelled by
  # loka-studio/electron/). A replacement job that packages the Electron Studio
  # into per-platform desktop installers is tracked in TODO.md and must be
  # verified on a test tag before re-adding it to the release assets below.

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            loka-setup-x64.exe
            loka-windows-x64.zip
            loka-linux-x64.tar.gz
            loka-macos-arm64.tar.gz
            loka-macos-x64.tar.gz
          generate_release_notes: true
