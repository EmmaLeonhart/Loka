[package]
name = "loka-sparql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SPARQL 1.1 parser, query planner, executor, and hybrid VECTOR_SIMILAR extension"

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true }
tracing.workspace = true
loka-core.workspace = true
loka-hnsw.workspace = true
# REGEX() and REPLACE() need real regex semantics; already in the dependency tree
# (transitively, via tracing-subscriber's env-filter), so this adds no new build.
regex = "1"

[dev-dependencies]
criterion.workspace = true
tempfile = "3"

[[bench]]
name = "sparql_query"
harness = false
